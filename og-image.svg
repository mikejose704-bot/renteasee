<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0E0B"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,166,81,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Green glow circle background -->
  <circle cx="600" cy="315" r="350" fill="radial-gradient(circle, rgba(0,166,81,0.15) 0%, transparent 70%)"/>
  <ellipse cx="600" cy="315" rx="400" ry="300" fill="rgba(0,166,81,0.05)"/>

  <!-- Big House Icon -->
  <!-- House body -->
  <rect x="430" y="280" width="340" height="220" rx="8" fill="#0F1511" stroke="#00A651" stroke-width="3"/>
  
  <!-- Roof -->
  <polygon points="390,285 600,120 810,285" fill="#00A651"/>
  <polygon points="400,285 600,132 800,285" fill="#062010"/>
  <line x1="600" y1="120" x2="600" y2="285" stroke="#00A651" stroke-width="2" opacity="0.4"/>

  <!-- Chimney -->
  <rect x="680" y="155" width="40" height="80" rx="4" fill="#00A651"/>
  <rect x="672" y="148" width="56" height="16" rx="4" fill="#00C060"/>

  <!-- Door -->
  <rect x="550" y="370" width="100" height="130" rx="6" fill="#00A651"/>
  <rect x="558" y="378" width="84" height="114" rx="4" fill="#062010"/>
  <circle cx="638" cy="438" r="6" fill="#00A651"/>

  <!-- Windows -->
  <rect x="450" y="310" width="80" height="70" rx="6" fill="#00A651" opacity="0.3"/>
  <rect x="458" y="318" width="64" height="54" rx="4" fill="#0A1F10"/>
  <line x1="490" y1="318" x2="490" y2="372" stroke="#00A651" stroke-width="2" opacity="0.5"/>
  <line x1="458" y1="345" x2="522" y2="345" stroke="#00A651" stroke-width="2" opacity="0.5"/>

  <rect x="670" y="310" width="80" height="70" rx="6" fill="#00A651" opacity="0.3"/>
  <rect x="678" y="318" width="64" height="54" rx="4" fill="#0A1F10"/>
  <line x1="710" y1="318" x2="710" y2="372" stroke="#00A651" stroke-width="2" opacity="0.5"/>
  <line x1="678" y1="345" x2="742" y2="345" stroke="#00A651" stroke-width="2" opacity="0.5"/>

  <!-- Ground line -->
  <rect x="380" y="498" width="440" height="4" rx="2" fill="#00A651" opacity="0.4"/>

  <!-- M-Pesa badge -->
  <rect x="430" y="520" width="100" height="28" rx="14" fill="rgba(0,166,81,0.2)" stroke="rgba(0,166,81,0.4)" stroke-width="1"/>
  <text x="480" y="539" font-family="monospace" font-size="11" font-weight="700" fill="#00A651" text-anchor="middle">M-PESA</text>

  <!-- Kenya flag colors accent -->
  <rect x="670" y="520" width="100" height="28" rx="14" fill="rgba(0,166,81,0.2)" stroke="rgba(0,166,81,0.4)" stroke-width="1"/>
  <text x="720" y="539" font-family="monospace" font-size="11" font-weight="700" fill="#00A651" text-anchor="middle">🇰🇪 KENYA</text>

  <!-- App name -->
  <text x="600" y="590" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#00C060" text-anchor="middle" letter-spacing="-2">RentEase</text>
  <text x="600" y="618" font-family="Arial, sans-serif" font-size="18" fill="#5A6B5C" text-anchor="middle" letter-spacing="4">PROPERTY MANAGEMENT</text>

  <!-- Decorative dots -->
  <circle cx="100" cy="100" r="60" fill="rgba(0,166,81,0.08)"/>
  <circle cx="1100" cy="530" r="80" fill="rgba(0,166,81,0.06)"/>
  <circle cx="150" cy="500" r="40" fill="rgba(0,166,81,0.05)"/>
  <circle cx="1050" cy="100" r="50" fill="rgba(0,166,81,0.07)"/>
</svg>
