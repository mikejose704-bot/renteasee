  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#00A651" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#060d08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="buildingGlow" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#00C060" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00C060" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="windowGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2015"/>
      <stop offset="100%" stop-color="#091508"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00A651" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00A651" stop-opacity="0"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00A651" stroke-width="0.4" stroke-opacity="0.08"/>
    </pattern>
  </defs>

